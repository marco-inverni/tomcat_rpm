name: Monitor Apache Tomcat 9 releases

on:
  schedule:
    - cron: '17 3 * * *' # Daily, UTC
  workflow_dispatch:
    inputs:
      tomcat_series:
        description: 'Optional override, e.g. 9.0'
        type: string
        required: false
      tomcat_version:
        description: 'Optional override: latest or 9.0.123'
        type: string
        required: false

# EDIT ONLY THESE VALUES for scheduled runs. No version is pinned elsewhere.
env:
  TOMCAT_SERIES: '9.0'
  TOMCAT_VERSION: 'latest'

permissions: {}
concurrency:
  group: tomcat-release-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
        with:
          persist-credentials: true

      - name: Check Apache release and prepare approved-state proposal
        id: resolve
        shell: bash
        env:
          SERIES_OVERRIDE: ${{ inputs.tomcat_series }}
          VERSION_OVERRIDE: ${{ inputs.tomcat_version }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          series="${SERIES_OVERRIDE:-$TOMCAT_SERIES}"
          requested="${VERSION_OVERRIDE:-$TOMCAT_VERSION}"

          # Stable version formats only; this repository is restricted to Tomcat 9.
          [[ "$series" =~ ^9\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid Tomcat 9 series' >&2; exit 1; }
          [[ "$requested" == latest || "$requested" =~ ^9\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Invalid Tomcat 9 version selector' >&2; exit 1;
          }
          if [[ "$requested" != latest && "$requested" != "${series}."* ]]; then
            echo 'Version is outside the selected series' >&2; exit 1
          fi

          # Restrict downloads to fixed official Apache HTTPS origins.
          fetch_small() {
            curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
              --max-filesize 262144 --proto '=https' --max-redirs 0 "$1"
          }
          http_status() {
            curl --silent --show-error --head --retry 2 --connect-timeout 10 --max-time 30 \
              --proto '=https' --max-redirs 0 --output /dev/null \
              --write-out '%{http_code}' "$1"
          }

          source=apache-downloads
          root='https://downloads.apache.org/tomcat'
          if [[ "$requested" == latest ]]; then
            # Current official distribution directory: v9.0.123/, etc.
            index="$(fetch_small "${root}/tomcat-9/")"
            escaped_series="${series//./\\.}"
            matches="$(printf '%s\n' "$index" | grep -Eo "v${escaped_series}\.[0-9]+/" || true)"
            [[ -n "$matches" ]] || { echo 'No stable Apache releases found for series' >&2; exit 1; }
            version="$(printf '%s\n' "$matches" | sed -E 's@^v(.*)/$@\1@' | sort -Vu | tail -n 1)"
          else
            version="$requested"
          fi

          filename="apache-tomcat-${version}.tar.gz"
          base="${root}/tomcat-9/v${version}/bin/${filename}"
          status="$(http_status "$base")"
          if [[ "$requested" != latest && "$status" == 404 ]]; then
            # Older explicitly selected releases leave the current mirror.
            source=apache-archive
            root='https://archive.apache.org/dist/tomcat'
            base="${root}/tomcat-9/v${version}/bin/${filename}"
            status="$(http_status "$base")"
          fi
          [[ "$status" == 200 ]] || { echo "Tomcat archive HEAD returned HTTP $status" >&2; exit 1; }

          sha_url="${base}.sha512"
          sig_url="${base}.asc"
          checksum_text="$(fetch_small "$sha_url")"
          digest="$(printf '%s\n' "$checksum_text" | awk -v expected="$filename" '
            NF == 2 && $2 == expected && length($1) == 128 && $1 ~ /^[0-9a-fA-F]+$/ {
              print tolower($1); n++
            }
            END { if (n != 1) exit 1 }
          ')" || { echo 'Malformed SHA-512 metadata or unexpected filename' >&2; exit 1; }
          signature="$(fetch_small "$sig_url")"
          [[ "$signature" == '-----BEGIN PGP SIGNATURE-----'* &&
             "$signature" == *'-----END PGP SIGNATURE-----' ]] || {
            echo 'Missing or malformed detached signature metadata' >&2; exit 1;
          }
          # Macro 1 checks only the availability/shape of the metadata. Actual
          # tarball download, SHA-512 comparison and PGP verification: Macro 2.

          manifest=release/tomcat-release.json
          approved='(none)'
          if [[ -f "$manifest" ]]; then
            jq -e 'type == "object" and (.tomcat_version | type == "string") and
              (.tomcat_series | type == "string")' "$manifest" > /dev/null || {
              echo 'Invalid approved manifest' >&2; exit 1;
            }
            approved="$(jq -r .tomcat_version "$manifest")"
            old_series="$(jq -r .tomcat_series "$manifest")"
            [[ "$old_series" =~ ^9\.(0|[1-9][0-9]*)$ &&
               "$approved" =~ ^9\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ &&
               "$approved" == "${old_series}."* ]] || {
              echo 'Approved manifest has inconsistent release metadata' >&2; exit 1;
            }
            lowest="$(printf '%s\n%s\n' "$approved" "$version" | sort -V | head -n 1)"
            [[ "$lowest" != "$version" || "$approved" == "$version" ]] || {
              echo "Refusing automatic downgrade: $approved -> $version" >&2; exit 1;
            }
          fi

          # jq is already installed on ubuntu-24.04; this is generated state,
          # not a second place to configure TOMCAT_VERSION.
          mkdir -p release
          tmp_manifest="$(mktemp)"
          jq -nS --arg series "$series" --arg version "$version" \
            --arg source "$source" --arg url "$base" \
            --arg sig "$sig_url" --arg shaurl "$sha_url" --arg sha "$digest" '{
              schema_version: 1, tomcat_series: $series, tomcat_version: $version,
              source: $source, download_url: $url, signature_url: $sig,
              sha512_url: $shaurl, sha512: $sha,
              signature_verification: "NOT_PERFORMED_IN_MACRO_TASK_1"
            }' > "$tmp_manifest"
          if [[ -f "$manifest" ]] && cmp -s "$manifest" "$tmp_manifest"; then
            changed=false
            rm -f "$tmp_manifest"
          else
            changed=true
            mv "$tmp_manifest" "$manifest"
          fi
          printf 'changed=%s\nseries=%s\nversion=%s\n' "$changed" "$series" "$version" >> "$GITHUB_OUTPUT"
          {
            echo '## Apache Tomcat upstream monitor'
            printf -- '- Series: `%s`\n' "$series"
            printf -- '- Resolved version: `%s`\n' "$version"
            printf -- '- Previously approved: `%s`\n' "$approved"
            echo "- New proposal needed: **$changed**"
            echo '- Tomcat tarball downloaded: **no**'
            echo '- Java/JDK/JRE downloaded: **no**'
            echo '- PGP cryptographic verification: **deferred to Macro Task 2**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or refresh reviewable release PR
        if: steps.resolve.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SERIES: ${{ steps.resolve.outputs.series }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          branch="automation/tomcat-${SERIES//./-}-release"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          old_sha=''
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            old_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
            if git show "refs/remotes/origin/${branch}:release/tomcat-release.json" \
              > "${RUNNER_TEMP}/proposed-manifest.json" 2> /dev/null &&
              cmp -s release/tomcat-release.json "${RUNNER_TEMP}/proposed-manifest.json"; then
              echo 'The existing proposal branch already contains this exact release.'
              if [[ -n "$(gh pr list --state open --head "$branch" --base "$BASE_BRANCH" \
                --json number --jq '.[0].number // empty')" ]]; then
                exit 0 # Avoid unnecessary commits on every daily run.
              fi
              # Branch exists but PR is missing: create the PR below.
            fi
          fi

          if [[ -z "$old_sha" ]] || ! cmp -s release/tomcat-release.json \
            "${RUNNER_TEMP}/proposed-manifest.json"; then
            git switch -c "proposal-${GITHUB_RUN_ID}"
            git add -- release/tomcat-release.json
            git commit -m "chore: propose Apache Tomcat ${VERSION}"
            if [[ -n "$old_sha" ]]; then
              git push "--force-with-lease=refs/heads/$branch:$old_sha" \
                origin "HEAD:refs/heads/$branch"
            else
              git push origin "HEAD:refs/heads/$branch"
            fi
          fi

          pr_body="$(cat <<EOF
          Proposed upstream Apache Tomcat **${VERSION}** (${SERIES}).

          Records the official .tar.gz address and advertised SHA-512 value.
          Metadata files were checked for shape and availability only.
          **Tarball download, actual digest comparison and cryptographic OpenPGP
          verification remain mandatory in Macro Task 2.** No Java downloaded.
          Review upstream release notes before approving.
          EOF
          )"
          pr="$(gh pr list --state open --head "$branch" --base "$BASE_BRANCH" \
            --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            gh pr create --base "$BASE_BRANCH" --head "$branch" \
              --title "chore(tomcat): approve Apache Tomcat ${VERSION}" --body "$pr_body"
          else
            gh pr edit "$pr" \
              --title "chore(tomcat): approve Apache Tomcat ${VERSION}" --body "$pr_body"
          fi
